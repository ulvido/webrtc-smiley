<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applet</title>
  <link rel="shortcut icon" href="#" />
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
  <link rel="stylesheet" href="style.css">
  <script>
    // service worker 2 registration
    if ("serviceWorker" in navigator) {
      // window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("sw2.js", { scope: `/app/` })
        .then(
          reg => console.log("[SW2] Registered ✓"/*, reg*/),
          error => console.log("[SW2] Registration failed!", error))
        .catch(console.error);
      // });
    } else {
      console.log("[SW2] Service Workers NOT Supported!");
    }
  </script>
</head>

<body>
  <h1>APPLET</h1>
  <a href="/">Anasayfa</a>
  <button onclick="history.back()">History back</button>
  <hr>
  <textarea name="text-to-speech" id="text-to-speech" cols="30" rows="4"
    placeholder="Konuşmasını istediği bir metin yazın">Çaylıoğlu Eczanesine hoşgeldiniz.Size nasıl yardımcı olabilirim?</textarea>
  <input type="button" value="Speak" id="speak-btn">
  <hr>
  <input type="button" value="Click to start speech recognition" id="start-rec-btn">
  <div id="result-rec"></div>
  <script type="module" src="script.js"></script>
</body>

</html>
